server:
  port: 8084
  
spring:
  application:
    name:  API-GATEWAY
  cloud:
    gateway:
      routes:
      - id: USERSERVICE
        uri: lb://USERSERVICE         #lb: means Load Balance
        predicates:
        - Path=/users/**
        
      - id: HOTELSERVICE
        uri: lb://HOTELSERVICE         #lb: means Load Balance
        predicates:
        - Path=/hotels/**
        
      - id: RATINGSERVICE
        uri: lb://RATINGSERVICE         #lb: means Load Balance
        predicates:
        - Path=/ratings/**
          
    
eureka:
  instance:
    ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka